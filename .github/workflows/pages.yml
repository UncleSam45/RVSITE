name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html main.js CNAME _site/
          cp _headers _site/ 2>/dev/null || true
          cp -R assets _site/assets
          cp logo.png banner.png _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Verify static gate artifact
        run: |
          test "$(cat _site/CNAME)" = "lacuisinederosalie.ca"
          grep -F "Nous ouvrons le 8 juillet." _site/index.html
          grep -F "main.js?v=20260714-delivery-weekdays-v4" _site/index.html

      - name: Publish static site to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deploy_dir="$(mktemp -d)"
          cp -R _site/. "${deploy_dir}/"
          cd "${deploy_dir}"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy static site ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" gh-pages
