<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>La cuisine de Rosalie | Site web en construction</title>
  <meta
    name="description"
    content="Le site web de La cuisine de Rosalie est temporairement en construction pendant la finalisation des commandes en ligne."
  />

  <meta name="theme-color" content="#FFF2B8" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="La cuisine de Rosalie | Site web en construction" />
  <meta
    property="og:description"
    content="Le site web de La cuisine de Rosalie est temporairement en construction pendant la finalisation des commandes en ligne."
  />

  <meta property="og:url" content="https://lacuisinederosalie.com/" />
  <meta property="og:locale" content="fr_CA" />
  <meta name="twitter:card" content="summary" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FoodEstablishment",
      "name": "La cuisine de Rosalie",
      "description": "Menu de la semaine du 30 juin au 6 juillet avec plats faits maison, portions Petit, Grand et Familial, extras et livraison locale.",
      "servesCuisine": "Repas maison",
      "hasMenu": {
        "@type": "Menu",
        "name": "Menu du 30 juin au 6 juillet",
        "hasMenuSection": [
          {
            "@type": "MenuSection",
            "name": "Les plats",
            "hasMenuItem": [
              { "@type": "MenuItem", "name": "Pâtes strogonoff" },
              { "@type": "MenuItem", "name": "Boulettes sauce asiatique avec riz et légumes" },
              { "@type": "MenuItem", "name": "Riz mexicain" },
              { "@type": "MenuItem", "name": "Rotini sauce rosée et parmesan" },
              { "@type": "MenuItem", "name": "Spaghetti sauce tomate et boulettes italiennes" },
              { "@type": "MenuItem", "name": "Poulet aux champignons avec riz" },
              { "@type": "MenuItem", "name": "Penne alfredo bacon" }
            ]
          },
          {
            "@type": "MenuSection",
            "name": "Extras",
            "hasMenuItem": [
              { "@type": "MenuItem", "name": "Soupe aux légumes", "offers": { "@type": "Offer", "price": "4", "priceCurrency": "CAD" } },
              { "@type": "MenuItem", "name": "Salade du chef", "offers": { "@type": "Offer", "price": "5", "priceCurrency": "CAD" } },
              { "@type": "MenuItem", "name": "Sous-marin jambon fromage", "offers": { "@type": "Offer", "price": "7", "priceCurrency": "CAD" } }
            ]
          }
        ]
      }
    }
  </script>

  <link rel="icon" href="./assets/images/logo.png" />

  <style>
    :root {
      color-scheme: light;
      --construction-bg: #fff7df;
      --construction-card: rgba(255, 255, 255, 0.94);
      --construction-text: #24382f;
      --construction-muted: #66766e;
      --construction-accent: #2f6f55;
      --construction-gold: #f7ca4d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(247, 202, 77, 0.34), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(114, 169, 130, 0.28), transparent 30%),
        linear-gradient(135deg, #fff2b8 0%, #fff7df 52%, #eaf8d7 100%);
      color: var(--construction-text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #webframe-root {
      display: none !important;
    }

    .construction-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .construction-card {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid rgba(232, 211, 133, 0.95);
      border-radius: 32px;
      background: var(--construction-card);
      box-shadow: 0 24px 70px rgba(82, 105, 69, 0.16);
      text-align: center;
    }

    .construction-logo {
      width: min(180px, 54vw);
      height: auto;
      margin-bottom: 26px;
    }

    .construction-eyebrow {
      margin: 0 0 12px;
      color: var(--construction-accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .construction-card h1 {
      margin: 0;
      color: var(--construction-text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.15rem, 7vw, 4.25rem);
      line-height: 1.03;
    }

    .construction-card p {
      max-width: 560px;
      margin: 18px auto 0;
      color: var(--construction-muted);
      font-size: clamp(1rem, 2vw, 1.16rem);
      line-height: 1.7;
    }

    .construction-status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding: 12px 18px;
      border-radius: 999px;
      background: #fff3c2;
      color: var(--construction-text);
      font-weight: 800;
    }

    .construction-status::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--construction-gold);
      box-shadow: 0 0 0 6px rgba(247, 202, 77, 0.22);
    }
  </style>
</head>

<body>
  <noscript>
    <div style="padding:24px;font-family:system-ui,sans-serif">
      Ce site nécessite JavaScript pour afficher le menu et le panier de commande.
    </div>
  </noscript>


  <main class="construction-page" aria-labelledby="construction-title">
    <section class="construction-card">
      <img class="construction-logo" src="./assets/images/logo.png" alt="La cuisine de Rosalie" />
      <p class="construction-eyebrow">Ouverture bientôt</p>
      <h1 id="construction-title">Site web en construction</h1>
      <p>Nous finalisons actuellement notre expérience de commande en ligne afin de vous offrir un service simple, fiable et sécuritaire. Merci de votre patience — nous serons de retour très bientôt.</p>
      <div class="construction-status" aria-label="Statut du site">Commandes en ligne temporairement indisponibles</div>
    </section>
  </main>

  <!--
    Temporary launch hold: keep the original application entrypoint in the
    repository, but do not render or load it until online payments are ready.

    <div id="webframe-root"></div>
    <script src="./main.js" defer></script>
  -->
</body>
</html>
