<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>La cuisine de Rosalie | Site en construction</title>
  <meta
    name="description"
    content="Le site de La cuisine de Rosalie est temporairement en construction. Merci de votre patience pendant les derniers ajustements."
  />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FFF2B8" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="La cuisine de Rosalie | Site en construction" />
  <meta
    property="og:description"
    content="Le site de La cuisine de Rosalie est temporairement en construction. Merci de votre patience pendant les derniers ajustements."
  />
  <meta property="og:url" content="https://lacuisinederosalie.com/" />
  <meta property="og:locale" content="fr_CA" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="./assets/images/logo.png" />

  <style>
    :root {
      --background: #fff2b8;
      --card: rgba(255, 253, 248, 0.94);
      --text: #24382f;
      --muted: #66766e;
      --olive: #2f6f55;
      --gold: #f7ca4d;
      --border: #ead99b;
      --shadow: 0 24px 70px rgba(82, 105, 69, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 221, 235, 0.76) 0, transparent 32%),
        radial-gradient(circle at 88% 12%, rgba(201, 241, 210, 0.84) 0, transparent 34%),
        linear-gradient(135deg, #fff2b8 0%, #ffefa7 48%, #eaf8d7 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid var(--border);
      border-radius: 32px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(220px, 72vw);
      margin-bottom: 28px;
      padding: 14px;
      border-radius: 28px;
      background: linear-gradient(135deg, #ffe889, #cfefa9 52%, #93d7b0);
      box-shadow: 0 14px 30px rgba(247, 202, 77, 0.24);
    }

    .logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--olive);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 8vw, 4.6rem);
      line-height: 0.98;
    }

    p {
      margin: 18px auto 0;
      max-width: 54ch;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.18rem);
      line-height: 1.7;
    }

    .notice {
      margin-top: 28px;
      padding: 16px 18px;
      border: 1px dashed var(--border);
      border-radius: 20px;
      background: rgba(255, 246, 204, 0.72);
      color: var(--olive);
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="logo" aria-hidden="true">
      <img src="./assets/images/logo.png" alt="" />
    </div>
    <p class="eyebrow">La cuisine de Rosalie</p>
    <h1 id="page-title">Site en construction</h1>
    <p>
      Nous effectuons présentement des ajustements au site web. Merci de votre patience — la page complète sera de retour bientôt.
    </p>
    <div class="notice">
      Pour éviter toute confusion, les menus et commandes en ligne sont temporairement désactivés.
    </div>
  </main>
</body>
</html>
